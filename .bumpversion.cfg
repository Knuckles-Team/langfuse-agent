[bumpversion]
current_version = 2.2.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(deploy-img-tag):docs/deployment.md]
search = knucklessg1/langfuse-agent:{current_version}
replace = knucklessg1/langfuse-agent:{new_version}

[bumpversion:file(dockerpin0):docker/Dockerfile]
search = langfuse-agent[mcp]=={current_version}
replace = langfuse-agent[mcp]=={new_version}

[bumpversion:file:langfuse_agent/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:tests/test_release_version.py]
search = EXPECTED_VERSION = "{current_version}"
replace = EXPECTED_VERSION = "{new_version}"
