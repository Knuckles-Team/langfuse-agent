[build-system]
requires = [ "setuptools==83.0.0", "wheel==0.46.2", "packaging==25.0",]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "langfuse-agent"
version = "2.3.6"
description = "Agent for interacting with Langfuse Observability API"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "scion-sdk[mcp]>=0.5.9,<0.6.0", "langfuse>=4,<5", "requests>=2.34.2",]
license = "MIT"
[[project.authors]]
name = "Repository Maintainers"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[project.scripts]
langfuse-mcp = "agent_connector_sdk.cli:serve"

[project.entry-points."agent_connector_sdk.prompt_providers"]
langfuse-agent = "langfuse_agent.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
langfuse-mcp = "langfuse_agent:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
extend-exclude = ["tests", "scripts"]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
langfuse_agent = [ "dependency-license-catalog.json", "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.setuptools.exclude-package-data]
"*" = [ "*.pyc", "*.pyo", "__pycache__/*", "**/__pycache__/*",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "langfuse_agent*",]
exclude = [ "docs*", "scripts*", "tests*",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
port = 8004
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]
limits = {"mcp" = {"memory_limit_env" = "AGENT_CONTAINER_MEMORY_LIMIT", "memory_limit" = "4g", "cpu_limit_env" = "AGENT_CONTAINER_CPU_LIMIT", "cpu_limit" = "2.0"}}
compose_env = ["LANGFUSE_HOST", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_SECRET_KEY", "REQUESTS_CA_BUNDLE", "SSL_CERT_FILE"]

[tool.pipelines.security]
license_allowed = ["CDLA-Permissive-2.0", "LGPL-3.0-only", "LGPL-3.0-or-later", "MIT-CMU", "PSF-2.0", "W3C-20150513", "zlib-acknowledgement"]
license_denied = ["AGPL-1.0-only", "AGPL-1.0-or-later", "GPL-1.0-only", "GPL-1.0-or-later", "GPL-2.0-only", "GPL-2.0-or-later"]
